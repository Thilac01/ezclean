[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezclean-data"
version = "0.1.0"
description = "A robust, dataset-agnostic loader, cleaner, and automated interactive visual pairplot dashboard engine."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "DeepMind Pair Programmer", email = "support@antigravity.ai" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.20.0",
    "plotly>=5.10.0",
    "requests>=2.25.0",
    "tabulate>=0.8.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ezclean*"]
